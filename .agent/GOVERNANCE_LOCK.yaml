central_governance:
  repository: EinzbernLi/agent-dev-governance
  version: "0.3.6"
  ref: ef250219070dea0d7861e4817831b8f447a91118
  follow_main: false
  note: "v0.3.6 includes PF-014 durable re-anchor semantics: runtime-local context is non-authoritative/provisional, safe bounded pre-anchor diagnostics are allowed, and authority-bearing action remains fail-closed until durable re-anchor plus applicable Lead activation complete. One Active Lead and bounded same-project workers remain unchanged."

modules:
  lprl:
    repository: EinzbernLi/agent-dev-governance
    version: "v0.2.3-pilot"
    ref: d63dae9ac1de65420f410cb36e6c2ccb58cc0478
    pin_separately: true
    note: "Aether LPRL is pinned to the central v0.2.3-pilot merge accepted through governance Issue #25 / PR #26. This pin does not authorize local materialization, Snapshot/Gate, retirement, migration, cleanup, or reclamation."

task_result_fact_source:
  mode: github_issue_pr
  mirror_full_task_result_bodies_into_agent_files: false

adoption_rules:
  project_specific_policy_file: .agent/LOCAL_POLICY.yaml
  current_state_file: .agent/PROJECT_STATE.md
  bootstrap_file: .agent/BOOTSTRAP.md
  lead_claim_sink: "github:EinzbernLi/AetherSwap#149"
  legacy_project_governance_is_compatibility_evidence: true
  ordinary_runtime_capabilities_are_session_state: true
  governance_upgrade_requires_explicit_review: true
  one_active_project_lead: true
  task_scoped_workers_do_not_claim_project_lead: true
  lead_handoff_requires_explicit_owner_intent: true
