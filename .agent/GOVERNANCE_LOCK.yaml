schema_version: "0.6"

governance:
  repository: EinzbernLi/agent-dev-governance
  protocol_version: "0.3.18"
  pinned_ref: aff6ff205eca64c594cc10b67a3454a765076bb0
  release_version_path: VERSION
  release_compatibility_path: GOVERNANCE_RELEASE.yaml

project_policy:
  local_policy_path: .agent/LOCAL_POLICY.yaml
  remains_downstream_local: true
  may_add_or_tighten_constraints: true
  may_weaken_central_invariants: false

policy_refs:
  takeover_reconciliation: docs/context-continuity/TAKEOVER_RECONCILIATION_GATE.md
  governance_currency: docs/project-adoption/GOVERNANCE_CURRENCY_PROTOCOL.md

modules:
  lprl:
    enabled: true
    repository: EinzbernLi/agent-dev-governance
    version: "v0.2.4-pilot"
    pinned_ref: 5f22e63414374b64ebbf4bd91601ede2f54e6f65
    root_path: docs/local-resource-lifecycle
    version_path: docs/local-resource-lifecycle/LPRL_SPEC.md

update_policy:
  mode: manual_pinned
  owner_choice_required_at_onboarding: true
  recommended_mode: github_native_notify
  auto_follow_main: false
  automatic_adoption_allowed: false
  automatic_pin_advance_allowed: false
  normal_takeover_queries_upstream: false
  prefer_downstream_local_update_signal: true
  require_compatibility_check_before_pin_change: true
  explicit_downstream_pin_update_required: true
  detector_template_path: templates/GOVERNANCE_UPDATE_CHECK.yml
  installed_workflow_path: null
  signal_type: github_issue
  signal_marker: "[GOVERNANCE-UPDATE-SIGNAL]"
  optional_private_source_secret: GOVERNANCE_SOURCE_TOKEN

privacy:
  register_project_with_upstream: false
  send_project_specific_facts_to_upstream: false
  send_usage_telemetry_to_upstream: false
  private_source_secret_remains_downstream_local: true
