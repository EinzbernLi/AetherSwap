schema_version: "1.0"
project: AetherSwap

branches:
  active_development: integration/auto-buyer-offer
  release_target: main
  integration_to_main_requires_explicit_owner_approval: true

fact_source:
  task_result_review_acceptance: github_issue_pr
  github_is_durable_technical_source: true
  chat_is_not_durable_authority: true

owner_gates:
  real_write_default: CLOSED
  explicit_owner_authorization_required_for:
    - real Steam writes
    - real BUFF writes
    - payments or purchase completion
    - trade-send, accept, or confirmation actions
    - listing or other platform mutations outside an already frozen authorized packet
    - integration/auto-buyer-offer -> main
    - scope expansion beyond a frozen Task
    - destructive local-resource migration, retirement, cleanup, or reclamation

product_authority_boundaries:
  host_purchase_and_payment_authority: retained
  auto_offer_primary_role: delivery_lifecycle_after_host_purchase
  worker_role: recovery_and_reconciliation_not_first_send
  duplicate_purchase_or_delivery_authority: forbidden

safety_invariants:
  - "External BUFF/Steam field, state, identity, or error semantics that are not verified must fail closed; do not guess."
  - "Non-idempotent write requests must not be retried blindly. Ambiguous outcomes enter RESULT_UNKNOWN or an equivalent fail-closed state."
  - "One purchase must not create competing purchase facts or duplicate first-send authority."
  - "Identity-sensitive delivery/listing operations require exact supported identity binding; names, prices, time proximity, latest-item heuristics, or manual guesses are not authority."
  - "pending_receipt=true is not proof that an item has entered buyer inventory."
  - "accept_all or equivalent broad confirmation authority is forbidden."
  - "Credentials, cookies, tokens, API keys, buyer_info, decrypted session material, and secret values must not enter logs, Issues, PRs, fixtures, or governance records."
  - "Tests and safety gates must not be deleted, skipped, weakened, or reinterpreted merely to obtain PASS."
  - "REAL-WRITE remains closed unless an exact separately authorized packet explicitly opens the required write boundary."

local_execution:
  isolated_workspace_or_worktree_required: true
  protected_historical_checkout_rule_ref: .agent/PROJECT_CONTEXT.md
  protected_historical_checkout_must_not_be_cleaned_reset_stashed_deleted_moved_or_used_as_experiment_workspace: true
  current_task_workspace_paths_belong_in_task_evidence_not_long_lived_policy: true
  exact_source_handoff_required_when_local_bytes_are_not_directly_reviewable_in_github: true

verification:
  normal_order:
    - focused tests
    - relevant regression tests
    - full suite when required by Task/risk
    - exact-head CI when repository workflow applies
    - post-merge review/CI when required
  historical_test_results_do_not_substitute_for_current_task_verification: true
  baseline_counts_are_task_bound_and_must_not_be_frozen_here: true
  exact_source_or_exact_tree_review_required_for_local_required_changes: true
  historical_and_simplicity_review_required_for_material_changes: true

work_concurrency:
  one_primary_business_task_at_a_time: true
  independent_governance_hardening_lprl_tracks_may_run_in_parallel_when_they_do_not_mutate_the_same_authority_or_runtime_state: true

legacy_governance_compatibility:
  retained_refs:
    - AGENTS.md
    - .agent/WORKFLOW.md
    - .agent/PROJECT_CONTEXT.md
    - .agent/CURRENT_INVARIANTS.md
    - .agent/AUTO_OFFER_*.md
    - .agent/TASK_TEMPLATE.md
    - .agent/REVIEW_CHECKLIST.md
    - .github/pull_request_template.md
  rule: "Legacy files remain domain/history evidence. They do not replace the pinned central governance, this LOCAL_POLICY, current PROJECT_STATE, or a newer exact Task/Result/Acceptance."
  conflict_resolution:
    - "Explicit OWNER safety authorization/denial for the affected action"
    - "Pinned central governance for generic coordination/dispatch/resume rules"
    - ".agent/LOCAL_POLICY.yaml for project-specific standing boundaries"
    - "Current exact Task/Result/Lead Acceptance for scoped work, provided it does not silently weaken standing OWNER safety gates"
    - ".agent/PROJECT_STATE.md for current compact project state"
    - "Legacy governance/domain evidence when non-conflicting"

lprl_boundary:
  authority_ref: "EinzbernLi/agent-dev-governance@c769bc0b7b102cd12e54fcd966d638fb88a5a2cc"
  current_phase_is_not_cleanup_authority: true
  no_snapshot_gate_retirement_migration_or_reclamation_without_separate_authorization: true
