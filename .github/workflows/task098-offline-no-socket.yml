name: TASK-098 Offline No-Socket

on:
  push:
    branches:
      - test/098-offline-no-socket

permissions:
  contents: read

jobs:
  offline-auto-offer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-ci.txt
          python -m pip install pytest-socket

      - name: Run Auto Offer offline suite with sockets disabled
        run: |
          python -m pytest -q --disable-socket \
            tests/test_auto_offer_*.py \
            tests/test_buff_buyer_send.py \
            tests/test_task042_buff_lifecycle_read.py \
            tests/test_task042_buff_order_evidence.py \
            tests/test_task042_refund_cleanup.py \
            tests/test_task050_steamauto_primary_path.py \
            tests/test_sync_sold_auto_offer_isolation.py

      - name: Run full repository suite with sockets disabled
        run: |
          python -m pytest -q --disable-socket
