name: TASK098 CI fix

on:
  push:
    branches:
      - task/098-canary-late-binding

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'TASK098 run CI fix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply CI fix
        run: python .agent/tmp_task098_ci_fix.py
      - name: Syntax check
        run: python -m py_compile app/auto_offer/canary_authority.py tests/test_auto_offer_canary_authority.py
      - name: Remove temporary helper
        run: git rm -f .agent/tmp_task098_ci_fix.py .github/workflows/task098-ci-fix.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "TASK-098: align seller canary accept authority test"
          git push origin HEAD:task/098-canary-late-binding
