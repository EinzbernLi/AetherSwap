name: Python CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - integration/auto-buyer-offer
  push:
    branches:
      - integration/auto-buyer-offer
      - luna/TASK-001-ci-baseline

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Run full test suite with baseline gate
        shell: bash
        run: |
          set +e
          python -m pytest -q --junitxml=pytest.xml
          test_status=$?
          set -e
          TEST_STATUS="$test_status" python - <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET

          expected = {
              'tests.test_buff_verification::test_make_request_raises_verification_required',
          }
          expected_total = 446
          root = ET.parse('pytest.xml').getroot()
          cases = list(root.iter('testcase'))
          failed = set()
          errors = set()
          for case in cases:
              node_name = f"{case.attrib.get('classname', '')}::{case.attrib.get('name', '')}"
              if case.find('failure') is not None:
                  failed.add(node_name)
              if case.find('error') is not None:
                  errors.add(node_name)
          test_status = int(os.environ['TEST_STATUS'])
          print(f'Collected test cases: {len(cases)}')
          print(f'Registered failures: {sorted(expected)}')
          print(f'Observed failures: {sorted(failed)}')
          print(f'Observed errors: {sorted(errors)}')
          if len(cases) != expected_total or errors or failed != expected or test_status not in (0, 1):
              print('Baseline gate failed: observed results differ from the registered failure baseline.')
              sys.exit(1)
          print('Baseline gate passed: observed failures exactly match the registered baseline.')
          PY