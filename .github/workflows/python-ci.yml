name: Python CI

on:
  pull_request:
    branches:
      - integration/auto-buyer-offer
  push:
    branches:
      - integration/auto-buyer-offer
      - luna/TASK-001-ci-baseline

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q