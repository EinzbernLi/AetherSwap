name: Python CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - integration/auto-buyer-offer
  push:
    branches:
      - integration/auto-buyer-offer
      - luna/TASK-001-ci-baseline
      - luna/TASK-003-ci-contract-cleanup

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-ci.txt
      - name: Run full test suite with strict baseline gate
        shell: bash
        run: |
          set +e
          python -m pytest -q --junitxml=pytest.xml
          test_status=$?
          set -e
          python .github/scripts/check_pytest_baseline.py \
            --junit pytest.xml \
            --pytest-status "$test_status" \
            --minimum-tests 447
