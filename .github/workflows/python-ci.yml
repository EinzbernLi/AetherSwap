name: Python CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - integration/auto-buyer-offer
  push:
    branches:
      - integration/auto-buyer-offer
      - luna/TASK-001-ci-baseline
      - luna/TASK-003-ci-contract-cleanup

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-ci.txt
      - name: Run full test suite with strict baseline gate
        shell: bash
        run: |
          set +e
          python -m pytest -q --junitxml=pytest.xml
          test_status=$?
          set -e
          TEST_STATUS="$test_status" python - <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET

          expected_total = 447
          root = ET.parse('pytest.xml').getroot()
          cases = list(root.iter('testcase'))
          failed = []
          errors = []
          skipped = 0
          for case in cases:
              node_name = f"{case.attrib.get('classname', '')}::{case.attrib.get('name', '')}"
              if case.find('failure') is not None:
                  failed.append(node_name)
              if case.find('error') is not None:
                  errors.append(node_name)
              if case.find('skipped') is not None:
                  skipped += 1
          test_status = int(os.environ['TEST_STATUS'])
          collection_errors = int(root.attrib.get('errors', '0'))
          passed = len(cases) - len(failed) - len(errors) - skipped
          print(f'Collected test cases: {len(cases)}')
          print(f'Passed: {passed}')
          print(f'Failed: {len(failed)} ({sorted(failed)})')
          print(f'Errors: {len(errors)} ({sorted(errors)})')
          print(f'Collection errors: {collection_errors}')
          print(f'Skipped: {skipped}')
          print('Registered failures: 0')
          if (
              len(cases) != expected_total
              or failed
              or errors
              or collection_errors
              or skipped
              or test_status != 0
          ):
              print('Baseline gate failed: the test suite is not strictly green.')
              sys.exit(1)
          print('Baseline gate passed: strict zero-failure result.')
          PY